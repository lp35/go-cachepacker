name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Linux (amd64)
        run: GOOS=linux GOARCH=amd64 go build -o go-cachepacker-linux-amd64 .

      - name: Build Linux (arm64)
        run: GOOS=linux GOARCH=arm64 go build -o go-cachepacker-linux-arm64 .

      - name: Build Windows (amd64)
        run: GOOS=windows GOARCH=amd64 go build -o go-cachepacker-windows-amd64.exe .

      - name: Extract release notes
        run: |
          awk '/^## \['"${{ github.ref_name }}"'\]/{found=1; next} found && /^## /{exit} found{print}' \
            CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            go-cachepacker-linux-amd64 \
            go-cachepacker-linux-arm64 \
            go-cachepacker-windows-amd64.exe \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
